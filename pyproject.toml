[project]
name = "evidence-agent"
version = "0.0.0"
description = "Traceable evidence research agent (scaffold; not product-ready)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
evidence-agent = "evidence_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
