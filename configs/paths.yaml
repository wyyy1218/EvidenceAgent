# Path map — no secrets. Absolute WORK_ROOT updated at S05 after data-disk verification.
# Relative paths are from WORK_ROOT unless noted.

work_root:
  # Local documentation / prep / backup endpoint (Windows).
  local_prep: "d:/1-实习/项目/EvidenceAgent"
  # AutoDL data-disk root — mount re-verified 2026-10-26 after expansion (100GiB; capacity gate PASS).
  autodl: "/root/autodl-tmp/evidence-agent"
  autodl_candidate: "/root/autodl-tmp/evidence-agent"
  # Active runtime root on the registered instance (code+data co-located on data disk).
  active: autodl
  active_path: "/root/autodl-tmp/evidence-agent"
  notes: >
    2026-10-26 probe_s05_host_a002 (container restarted 11:24:57): /root/autodl-tmp is the real
    data disk (/dev/md0 xfs, /docker/volumes/autodl-container-12ce4dade8-72ec6d56-storage/_data),
    total 100.00 GiB (26214400 x 4096 B). Capacity gate >=100GiB PASS; S06 downloads allowed.
    Keep envs/models/cache on this disk; system overlay / is only 30GiB.

