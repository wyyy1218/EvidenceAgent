project:
  name: evidence-agent
  spec_version: "1.0"
  seed: 42
  timezone: UTC
  release_license: Apache-2.0
upstream:
  repository: https://github.com/langchain-ai/deepagents
  package_version: "0.7.32"
  commit: e85c6b98087861512d2c5240305e16cfac68a746
models:
  base: Qwen/Qwen3-4B-Instruct-2507
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  teacher: qwen3.8-max-0902
  teacher_mode: non_thinking
  teacher_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  teacher_fallback: local_base
  english_judge: flan-t5-large
  revision_policy: resolve_once_save_full_sha
runtime:
  python: "3.11"
  cuda_wheel: "12.8"
  minimum_linux_driver: "570.26"
  # Target spec stays as designed; observed instance is RTX 4080 SUPER 32GB (DEVIATION_ACCEPTED,
  # see repo/docs/decisions/decision_log.md D-20261026-4080 and Rule/REMOTE.md).
  gpu: RTX4090_24GB
  gpu_observed: RTX_4080_SUPER_32GB
  gpu_count: 1
  cpu_min: 12
  ram_min_gib: 64
  work_disk_min_gib: 100
  cpu_model_threads: 8
  worker_concurrency: 1
  max_queue_size: 10
  ui_port: 6006
  api_port: 6008
  model_host: 127.0.0.1
  model_port: 8001
ingestion:
  allowed_suffixes: [pdf, md, txt]
  max_file_mib: 20
  max_pdf_pages: 200
  max_project_documents: 50
  min_pdf_chars_per_page: 30
  max_chunk_qwen_tokens: 384
  max_chunk_embedding_tokens: 512
  overlap_qwen_tokens: 64
retrieval:
  embedding_device: cpu
  reranker_device: cpu
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  rerank_top_k: 12
  return_top_k: 6
  preview_max_tokens: 72
  indexing_batch: 16
web:
  provider: tavily
  search_depth: basic
  results_per_search: 5
  max_live_search_calls: 3
  fetch_max_mib: 5
  redirect_limit: 3
  http_timeout_seconds: 15
  search_timeout_seconds: 20
  default_mode: "off"
  auto_payg: false
budget:
  tool_calls: 8
  input_tokens: 48000
  output_tokens: 4096
  final_output_reserve: 1536
  wall_seconds: 240
  model_call_timeout_seconds: 60
  invalid_action_repairs: 1
  transient_tool_retries: 1
generation:
  max_model_len: 8192
  policy_prompt_max: 2880
  policy_completion_max: 192
  writer_completion_max: 768
  verifier_completion_max: 768
  writer_evidence_max: 6
  writer_quote_max_tokens: 512
  online_temperature: 0.0
  teacher_temperature: 0.6
  gpu_memory_utilization: 0.80
  max_num_seqs: 2
  lora_max_rank: 16
data:
  hotpotqa: {train: 600, dev: 100, test: 200, dataset_id: hotpotqa_distractor_s25_v1}
  chinese: {train: 240, dev: 60, test: 100, dataset_id: zh_tech_s27_v1, sources_manifest: mf_chinese_sources_s26_0001}
  chinese_categories: 4
  chinese_replay_fraction: 0.5
  sft_train_states_target: 4000
  sft_dev_states_target: 800
  sft_train_states_minimum: 2000
  dpo_train_pairs_target: 600
  dpo_dev_pairs_target: 100
  dpo_train_pairs_minimum: 300
training:
  quantization: nf4
  double_quantization: true
  compute_dtype: bfloat16
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  max_length: 3072
  micro_batch: 1
  gradient_checkpointing: true
  packing: false
  sft:
    epochs: 2
    accumulation: 16
    learning_rate: 0.0001
    scheduler: cosine
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0
    optimizer: paged_adamw_8bit
    completion_only_loss: true
    save_steps: 100
    logging_steps: 10
  dpo:
    epochs: 2
    accumulation: 8
    learning_rate: 0.000005
    beta: 0.1
    loss_type: sigmoid
    max_prompt_length: 2880
    max_completion_length: 192
    precompute_ref_log_probs: true
    # PEFT ModuleDict forbids name "train" (collides with nn.Module.train); use policy.
    model_adapter_name: policy
    ref_adapter_name: reference
    save_steps: 50
    logging_steps: 10
evaluation:
  systems: [B0, B1, B2, E0, E1, E2]
  test_tasks: 300
  ablation_tasks: 100
  extra_ablations: 2
  budget_curve_tasks: 60
  extra_curve_budgets: [4, 12]
  curve_systems: 2
  stability_tasks: 60
  extra_sampling_seeds: [43, 44]
  stability_temperature: 0.3
  drbench_tasks: 12
  live_tasks: 20
  external_systems: 2
  human_review_tasks: 60
  human_review_english: 20
  human_review_chinese: 40
  bootstrap_samples: 10000
  confidence_level: 0.95
release:
  maximum_quality_drop: 0.02
  maximum_support_drop: 0.02
  maximum_false_answer_increase: 0.02
  minimum_valid_action_rate: 0.98
  quality_tie_margin: 0.01
  support_tie_margin: 0.01
cost:
  currency: CNY
  total_cap: 1500
  gpu_cap: 600
  gpu_hours_cap: 120
  gpu_hourly_procurement_cap: 5
  teacher_and_judge_cap: 300
  search_cap: 100
  storage_cap: 100
  contingency: 400
